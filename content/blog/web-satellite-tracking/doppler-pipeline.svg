<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="780" height="470" rx="14" fill="#f7f8fa" stroke="#d7dbe0"/>
  <style>
    .box { fill:#ffffff; stroke:#5b7cfa; stroke-width:2; }
    .core { fill:#eef2ff; stroke:#3b5bdb; stroke-width:2; }
    .src { fill:#f0fdf4; stroke:#2f9e44; stroke-width:2; }
    .lo { fill:#fff7ed; stroke:#e8842b; stroke-width:2; }
    .t { fill:#1b2430; font-size:15px; font-weight:600; }
    .s { fill:#55616f; font-size:12px; }
    .lbl { fill:#55616f; font-size:11.5px; font-style:italic; }
    .arr { stroke:#8793a3; stroke-width:1.6; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#8793a3"/>
    </marker>
  </defs>

  <text x="30" y="34" class="s">External data (refreshed in the background)</text>

  <rect x="30" y="46" width="230" height="58" rx="10" class="src"/>
  <text x="46" y="72" class="t">CelesTrak GP</text>
  <text x="46" y="92" class="s">amateur TLE group · 12 h</text>

  <rect x="30" y="118" width="230" height="58" rx="10" class="src"/>
  <text x="46" y="144" class="t">SatNOGS DB</text>
  <text x="46" y="164" class="s">transmitters · modes · 7 d</text>

  <rect x="320" y="82" width="190" height="58" rx="10" class="box"/>
  <text x="338" y="108" class="t">internal/satdb</text>
  <text x="338" y="128" class="s">mirror → store (offline)</text>

  <rect x="320" y="176" width="190" height="64" rx="10" class="core"/>
  <text x="338" y="202" class="t">internal/orbit</text>
  <text x="338" y="223" class="s">SGP4 · look angles · passes</text>

  <rect x="320" y="276" width="190" height="72" rx="10" class="core"/>
  <text x="338" y="302" class="t">internal/tracker</text>
  <text x="338" y="322" class="s">Doppler ↑/↓ · follow dial</text>
  <text x="338" y="339" class="s">1 Hz tick · interlocks</text>

  <rect x="560" y="276" width="190" height="72" rx="10" class="lo"/>
  <text x="578" y="302" class="t">internal/rig</text>
  <text x="578" y="322" class="s">CI-V state engine</text>
  <text x="578" y="339" class="s">IC-910 · Main/Sub VFO</text>

  <rect x="320" y="384" width="430" height="58" rx="10" class="box"/>
  <text x="338" y="410" class="t">internal/api — REST + WebSocket :8080</text>
  <text x="338" y="429" class="s">Svelte console: SkyPlot · WorldMap · FreqPanel</text>

  <!-- flows -->
  <path class="arr" d="M260 75 L290 75 L290 104 L318 104"/>
  <path class="arr" d="M260 147 L290 147 L290 116 L318 116"/>
  <path class="arr" d="M415 140 L415 174"/>
  <text x="424" y="162" class="lbl">TLE → propagator</text>
  <path class="arr" d="M415 240 L415 274"/>
  <text x="424" y="262" class="lbl">az/el · range rate</text>
  <path class="arr" d="M510 312 L558 312"/>
  <text x="512" y="302" class="lbl">SetFreq</text>
  <path class="arr" d="M655 348 L655 366 L510 366 L510 384"/>
  <text x="520" y="362" class="lbl">read-back</text>
  <path class="arr" d="M415 348 L415 384"/>
  <text x="424" y="370" class="lbl">status push</text>
</svg>
